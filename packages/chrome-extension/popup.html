<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 2 Fig</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="HTML 2 Fig" class="brand-icon">
        <div class="brand-text">
          <span class="brand-name">HTML 2 Fig</span>
          <span class="brand-sub">Web to Figma</span>
        </div>
      </div>
      <div class="status-dot" title="Ready to capture"></div>
    </div>

    <button type="button" class="btn-capture" id="btnCapture">
      <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span class="btn-text" id="btnText">Capture Page</span>
    </button>

    <div class="status-box" id="statusBox" style="display: none;"></div>

    <div class="footer-hint">
      <span>Paste directly into Figma</span>
      <kbd>Ctrl+V</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
