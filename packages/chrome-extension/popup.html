<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 2 Fig</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <header class="card-header">
      <div class="logo-area">
        <img src="icons/icon48.png" alt="Logo" class="logo-img" />
        <div class="title-group">
          <div class="app-title">HTML 2 Fig</div>
          <div class="app-subtitle">Webpage to Figma</div>
        </div>
      </div>
      <span class="version-tag">v1.0</span>
    </header>

    <div class="setting-row" id="toggleRow">
      <div class="setting-text">
        <div class="setting-title">Capture Hover States</div>
        <div class="setting-desc" id="hoverDesc">Without hover (default)</div>
      </div>
      <label class="apple-switch" for="hoverToggle" aria-label="Toggle hover capture">
        <input type="checkbox" id="hoverToggle" />
        <span class="switch-slider"></span>
      </label>
    </div>

    <div class="info-banner" id="infoBanner">
      <svg class="info-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span class="info-msg" id="infoMsg">Captures clean layout with hover states & animations suppressed.</span>
    </div>

    <button type="button" class="btn-capture" id="btnCapture">
      <svg class="capture-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <span class="btn-text" id="btnText">Capture Page</span>
    </button>

    <div class="status-box" id="statusBox" style="display: none;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
