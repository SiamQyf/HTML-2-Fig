<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      width: 380px;
      background: #09090b;
    }

    body {
      width: 380px;
      background: #09090b;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      padding: 0;
      margin: 0;
    }

    .outer {
      background: #09090b;
      overflow: hidden;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      height: 40px;
      padding: 0 10px;
      background: #2c2c2c;
      gap: 8px;
    }

    .logo {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
      display: block;
    }

    .divider-v {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
      margin: 0 2px;
    }

    .brand {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      flex: 1;
    }

    .sep {
      height: 1px;
      background: rgba(255,255,255,0.07);
    }

    .bottom {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 13px 13px;
      background: #2c2c2c;
    }

    .warn-icon {
      font-size: 20px;
      flex-shrink: 0;
      color: #FFA040;
      line-height: 1;
    }

    .message {
      flex: 1;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-bottom: 3px;
      line-height: 1.3;
    }

    /* NO white-space:nowrap. This is the longest string in the popup and .outer has
       overflow:hidden, so nowrap clipped longer locales mid-word with no ellipsis. In English
       the line fits well within 380px, so wrapping never triggers and the popup is unchanged. */
    .sub {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      line-height: 1.5;
    }

    .e2f-btn {
      display: block;
      margin: 11px 0 9px;
      padding: 8px 12px;
      background: #ffffff;
      color: #09090b;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .e2f-btn:hover { background: rgba(255,255,255,0.85); }
    .e2f-btn:active { background: rgba(255,255,255,0.72); }
  </style>
</head>
<body>
  <div class="outer">
    <div class="toolbar-row">
      <img class="logo" src="icons/icon48.png" alt="">
      <div class="divider-v"></div>
      <span class="brand" data-i18n="extName">Export to Figma</span>
    </div>
    <div class="sep"></div>
    <div class="bottom">
      <span class="warn-icon">⚠</span>
      <div class="message">
        <p class="title" data-i18n="unsupTitle">Page not supported</p>
        <p class="sub" data-i18n="unsupSub">Navigate to any webpage and click the extension again</p>
      </div>
    </div>
  </div>
  <!-- Loaded FIRST: it starts resolving the language override immediately, so the async work
       overlaps parsing unsupported.js. Both are classic parser-blocking scripts, so order is
       guaranteed. Auto-staged by release/derive.mjs via this src= reference. -->
  <script src="e2f-i18n-page.js"></script>
  <script src="unsupported.js"></script>
</body>
</html>
