<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 2 Fig</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1e1e1e;
    --bg2: #282828;
    --bg3: #383838;
    --fg: #ffffff;
    --fg2: #a5a5a5;
    --fg3: #6e6e6e;
    --accent: #0d99ff;
    --accent-hover: #38aeff;
    --accent-gradient: linear-gradient(135deg, #0d99ff 0%, #7b61ff 100%);
    --success: #10b981;
    --error: #ef4444;
    --radius: 8px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--font); font-size: 12px;
    overflow: hidden; user-select: none;
  }
  .container {
    display: flex; flex-direction: column; height: 100%;
    padding: 16px; gap: 12px;
  }
  .header {
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff;
    box-shadow: 0 4px 12px rgba(13, 153, 255, 0.3);
  }
  .title-wrap h1 { font-size: 14px; font-weight: 600; color: #fff; }
  .title-wrap p { font-size: 11px; color: var(--fg2); }

  /* Interactive Paste Box Textarea */
  .paste-container {
    display: flex; flex-direction: column; gap: 6px;
  }
  .paste-label {
    font-size: 11.5px; color: var(--fg2); display: flex; align-items: center; justify-content: space-between;
  }
  .kbd-badge {
    background: var(--bg3); border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 1px 6px; border-radius: 4px; font-family: monospace; font-size: 10.5px; color: #fff;
  }
  .paste-textarea {
    width: 100%; height: 85px; padding: 10px 12px;
    background: var(--bg2); border: 1.5px dashed var(--bg3);
    border-radius: var(--radius); color: var(--fg);
    font-family: 'SF Mono', Consolas, monospace; font-size: 11px;
    resize: none; outline: none; transition: all 0.15s ease;
  }
  .paste-textarea:focus {
    border-color: var(--accent); background: rgba(13, 153, 255, 0.04);
  }
  .paste-textarea::placeholder { color: var(--fg3); line-height: 1.5; }

  .btn-primary {
    width: 100%; padding: 11px 16px;
    background: var(--accent-gradient);
    border: none; border-radius: var(--radius);
    color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 16px rgba(13, 153, 255, 0.25);
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled {
    background: var(--bg3); cursor: not-allowed;
    color: var(--fg3); box-shadow: none;
  }

  .progress-wrap {
    display: none; flex-direction: column; gap: 6px;
  }
  .progress-wrap.active { display: flex; }
  .progress-bar-bg {
    width: 100%; height: 5px; background: var(--bg3);
    border-radius: 3px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%; background: var(--accent-gradient);
    border-radius: 3px; transition: width 0.15s ease;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--fg2);
  }

  .status-badge {
    min-height: 20px; font-size: 11.5px;
    display: flex; align-items: center; gap: 6px;
    color: var(--fg2);
  }
  .status-badge.success { color: var(--success); }
  .status-badge.error { color: var(--error); }

  .log-panel {
    margin-top: auto; border-top: 1px solid var(--bg3);
    padding-top: 8px; font-size: 10.5px;
    font-family: 'SF Mono', Consolas, monospace; color: var(--fg3);
    max-height: 70px; overflow-y: auto;
  }
</style>
</head>
<body>
<div class="container" id="appContainer">
  <div class="header">
    <div class="logo">H2F</div>
    <div class="title-wrap">
      <h1>HTML 2 Fig</h1>
      <p>Convert webpages into native Figma layers</p>
    </div>
  </div>

  <div class="paste-container">
    <div class="paste-label">
      <span>Paste Payload</span>
      <span>Press <span class="kbd-badge">Ctrl+V</span> / <span class="kbd-badge">Cmd+V</span></span>
    </div>
    <textarea class="paste-textarea" id="pasteInput" placeholder="Click here and press Ctrl+V to paste captured page data..."></textarea>
  </div>

  <button class="btn-primary" id="btnImport">
    <span>Import Data</span>
  </button>

  <!-- Progress Bar -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-info">
      <span id="progressLabel">Rendering...</span>
      <span id="progressPercent">0%</span>
    </div>
  </div>

  <div class="status-badge" id="statusBadge">Ready — capture webpage, then paste into the box</div>
  <div class="log-panel" id="logPanel"></div>
</div>

<script>
  const pasteInput = document.getElementById('pasteInput');
  const btnImport = document.getElementById('btnImport');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressLabel = document.getElementById('progressLabel');
  const progressPercent = document.getElementById('progressPercent');
  const statusBadge = document.getElementById('statusBadge');
  const logPanel = document.getElementById('logPanel');

  function log(msg) {
    const line = document.createElement('div');
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logPanel.appendChild(line);
    logPanel.scrollTop = logPanel.scrollHeight;
  }

  function setStatus(text, type = '') {
    statusBadge.textContent = text;
    statusBadge.className = 'status-badge ' + type;
  }

  function updateProgress(pct, msg) {
    progressWrap.classList.add('active');
    progressBar.style.width = pct + '%';
    progressPercent.textContent = pct + '%';
    if (msg) progressLabel.textContent = msg;
  }

  function processPayload(text) {
    if (!text || text.trim().length < 15) {
      setStatus('Please paste the capture JSON data first.', 'error');
      return;
    }
    try {
      const data = JSON.parse(text.trim());
      if (!data.root || !data.version) {
        setStatus('Invalid capture payload structure', 'error');
        return;
      }
      log(`Payload loaded: ${(text.length / 1024).toFixed(1)} KB (${data.documentTitle || 'Untitled'})`);
      btnImport.disabled = true;
      pasteInput.disabled = true;
      setStatus('Rendering to canvas...', 'info');
      updateProgress(0, 'Initializing layer graph...');
      parent.postMessage({ pluginMessage: { type: 'import', data } }, '*');
    } catch (e) {
      setStatus('JSON Parse Error: ' + e.message, 'error');
      log('Parse error: ' + e.message);
    }
  }

  // Auto-process as soon as the user pastes into the textarea
  pasteInput.addEventListener('paste', (e) => {
    // Read clipboardData directly from event
    const text = (e.clipboardData || window.clipboardData)?.getData('text');
    if (text && text.length > 20) {
      e.preventDefault();
      pasteInput.value = text.slice(0, 100) + '... (' + (text.length / 1024).toFixed(1) + ' KB)';
      processPayload(text);
    }
  });

  // Also handle input / text changes
  pasteInput.addEventListener('input', () => {
    const val = pasteInput.value;
    if (val && val.length > 50 && val.includes('"version"')) {
      processPayload(val);
    }
  });

  // Import button triggers processing whatever is in the box
  btnImport.addEventListener('click', () => {
    processPayload(pasteInput.value);
  });

  // Global window paste fallback
  window.addEventListener('paste', (e) => {
    if (document.activeElement !== pasteInput) {
      const text = (e.clipboardData || window.clipboardData)?.getData('text');
      if (text && text.length > 20) {
        e.preventDefault();
        pasteInput.value = text.slice(0, 100) + '... (' + (text.length / 1024).toFixed(1) + ' KB)';
        processPayload(text);
      }
    }
  });

  window.onmessage = (event) => {
    const msg = event.data?.pluginMessage;
    if (!msg) return;
    if (msg.type === 'progress') {
      updateProgress(msg.percent, msg.label);
    } else if (msg.type === 'complete') {
      updateProgress(100, 'Import completed!');
      setStatus('✅ Imported successfully!', 'success');
      btnImport.disabled = false;
      pasteInput.disabled = false;
      log(`Render completed in ${msg.duration || 0}ms`);
    } else if (msg.type === 'error') {
      setStatus('❌ Render failed: ' + msg.message, 'error');
      btnImport.disabled = false;
      pasteInput.disabled = false;
      log('Error: ' + msg.message);
    } else if (msg.type === 'log') {
      log(msg.message);
    }
  };

  // Focus textarea on load
  setTimeout(() => pasteInput.focus(), 100);
</script>
</body>
</html>
