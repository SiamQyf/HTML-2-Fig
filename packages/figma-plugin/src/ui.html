<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 2 Fig</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d0f18;
    --bg2: #161926;
    --bg3: #222738;
    --fg: #f8fafc;
    --fg2: #94a3b8;
    --fg3: #64748b;
    --accent: #00f2fe;
    --accent-hover: #4facfe;
    --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #6366f1 100%);
    --accent-glow: rgba(0, 242, 254, 0.35);
    --success: #10b981;
    --error: #ef4444;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
  }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--font); font-size: 12px;
    overflow: hidden; user-select: none;
  }
  .container {
    display: flex; flex-direction: column; height: 100%;
    padding: 16px; gap: 14px;
  }
  .header {
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px var(--accent-glow);
    flex-shrink: 0;
  }
  .logo svg {
    color: #ffffff;
  }
  .title-wrap h1 { font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px; }
  .title-wrap p { font-size: 10.5px; color: var(--fg2); }

  /* Interactive Paste Box Textarea */
  .paste-container {
    display: flex; flex-direction: column; gap: 6px;
  }
  .paste-label {
    font-size: 11px; color: var(--fg2); display: flex; align-items: center; justify-content: space-between;
  }
  .kbd-badge {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 1px 6px; border-radius: 4px; font-family: inherit; font-size: 10px; color: #cbd5e1; font-weight: 600;
  }
  .paste-textarea {
    width: 100%; height: 85px; padding: 10px 12px;
    background: var(--bg2); border: 1.5px dashed rgba(255, 255, 255, 0.12);
    border-radius: var(--radius); color: var(--fg);
    font-family: 'SF Mono', Consolas, monospace; font-size: 11px;
    resize: none; outline: none; transition: all 0.2s ease;
  }
  .paste-textarea:focus {
    border-color: var(--accent); background: rgba(0, 242, 254, 0.03);
    box-shadow: 0 0 16px rgba(0, 242, 254, 0.15);
  }
  .paste-textarea::placeholder { color: var(--fg3); line-height: 1.5; }

  .actions-row {
    display: flex; gap: 8px; width: 100%;
  }
  .btn-secondary {
    flex: 1; padding: 8px 10px;
    background: var(--bg3);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius);
    color: var(--fg); font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.22);
  }
  .btn-secondary:active {
    transform: scale(0.98);
  }
  .btn-secondary:disabled {
    opacity: 0.5; cursor: not-allowed;
  }
  .paste-textarea.dragover {
    border-color: var(--accent) !important;
    background: rgba(0, 242, 254, 0.08) !important;
  }

  .btn-primary {
    width: 100%; padding: 12px 16px;
    background: var(--accent-gradient);
    border: none; border-radius: var(--radius);
    color: #fff; font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 20px var(--accent-glow);
    letter-spacing: -0.2px;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(79, 172, 254, 0.5);
    filter: brightness(1.06);
  }
  .btn-primary:active {
    transform: translateY(1px) scale(0.98);
  }
  .btn-primary:disabled {
    background: var(--bg3); cursor: not-allowed;
    color: var(--fg3); box-shadow: none; transform: none; filter: none;
  }

  .progress-wrap {
    display: none; flex-direction: column; gap: 6px;
  }
  .progress-wrap.active { display: flex; }
  .progress-bar-bg {
    width: 100%; height: 5px; background: var(--bg2);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 999px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%; background: var(--accent-gradient);
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    border-radius: 999px; transition: width 0.15s ease;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--fg2);
  }

  .status-badge {
    min-height: 20px; font-size: 11.5px;
    display: flex; align-items: center; gap: 6px;
    color: var(--fg2);
  }
  .status-badge.success { color: #34d399; }
  .status-badge.error { color: #f87171; }

  .log-panel {
    margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 8px; font-size: 10.5px;
    font-family: 'SF Mono', Consolas, monospace; color: var(--fg3);
    max-height: 70px; overflow-y: auto;
  }
</style>
</head>
<body>
<div class="container" id="appContainer">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    </div>
    <div class="title-wrap">
      <h1>HTML 2 Fig</h1>
      <p>Convert webpages into native Figma layers</p>
    </div>
  </div>

  <div class="paste-container">
    <div class="paste-label">
      <span>Paste Payload</span>
      <span>Press <span class="kbd-badge">Ctrl+V</span> / <span class="kbd-badge">Cmd+V</span></span>
    </div>
    <textarea class="paste-textarea" id="pasteInput" placeholder="Click here and press Ctrl+V, or drag & drop capture JSON..."></textarea>
    <div class="actions-row">
      <button class="btn-secondary" id="btnPasteClipboard" type="button" title="Paste directly from clipboard">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        <span>Paste Clipboard</span>
      </button>
      <button class="btn-secondary" id="btnUploadFile" type="button" title="Load JSON from file">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <span>Upload JSON</span>
      </button>
      <input type="file" id="jsonFileInput" accept=".json,application/json,text/plain" style="display: none;" />
    </div>
  </div>

  <button class="btn-primary" id="btnImport">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    <span>Import into Canvas</span>
  </button>

  <!-- Progress Bar -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-info">
      <span id="progressLabel">Painting...</span>
      <span id="progressPercent">0%</span>
    </div>
  </div>

  <div class="status-badge" id="statusBadge">Ready — capture webpage, then paste into the box</div>
  <div class="log-panel" id="logPanel"></div>
</div>

<script>
  const pasteInput = document.getElementById('pasteInput');
  const btnImport = document.getElementById('btnImport');
  const btnPasteClipboard = document.getElementById('btnPasteClipboard');
  const btnUploadFile = document.getElementById('btnUploadFile');
  const jsonFileInput = document.getElementById('jsonFileInput');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressLabel = document.getElementById('progressLabel');
  const progressPercent = document.getElementById('progressPercent');
  const statusBadge = document.getElementById('statusBadge');
  const logPanel = document.getElementById('logPanel');

  function log(msg) {
    const line = document.createElement('div');
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logPanel.appendChild(line);
    logPanel.scrollTop = logPanel.scrollHeight;
  }

  function setStatus(text, type = '') {
    statusBadge.textContent = text;
    statusBadge.className = 'status-badge ' + type;
  }

  function updateProgress(pct, msg) {
    progressWrap.classList.add('active');
    progressBar.style.width = pct + '%';
    progressPercent.textContent = pct + '%';
    if (msg) progressLabel.textContent = msg;
  }

  let isImporting = false;

  function processPayload(text) {
    if (isImporting) return;
    if (!text || text.trim().length < 15) {
      setStatus('Please paste the capture JSON data first.', 'error');
      return;
    }
    try {
      const data = JSON.parse(text.trim());
      if (!data.root || !data.version) {
        setStatus('Invalid capture payload structure', 'error');
        return;
      }
      isImporting = true;
      log(`Payload loaded: ${(text.length / 1024).toFixed(1)} KB (${data.documentTitle || 'Untitled'})`);
      btnImport.disabled = true;
      if (btnPasteClipboard) btnPasteClipboard.disabled = true;
      if (btnUploadFile) btnUploadFile.disabled = true;
      pasteInput.disabled = true;
      setStatus('Painting to canvas...', 'info');
      updateProgress(0, 'Initializing layer graph...');
      try {
        parent.postMessage({ pluginMessage: { type: 'import', data } }, '*');
      } catch (bridgeErr) {
        isImporting = false;
        btnImport.disabled = false;
        if (btnPasteClipboard) btnPasteClipboard.disabled = false;
        if (btnUploadFile) btnUploadFile.disabled = false;
        pasteInput.disabled = false;
        setStatus('Bridge Error: ' + (bridgeErr.message || bridgeErr), 'error');
        log('postMessage error: ' + (bridgeErr.message || bridgeErr));
      }
    } catch (e) {
      isImporting = false;
      setStatus('JSON Parse Error: ' + e.message, 'error');
      log('Parse error: ' + e.message);
    }
  }

  async function handlePasteEvent(e) {
    if (isImporting) return;
    let text = (e?.clipboardData || window.clipboardData)?.getData('text');
    // If synchronous clipboardData returned empty (common in Chromium for large payloads), fall back to async clipboard API
    if (!text && navigator.clipboard && navigator.clipboard.readText) {
      try {
        text = await navigator.clipboard.readText();
      } catch (clipErr) {
        log('Async clipboard fallback: ' + clipErr.message);
      }
    }
    if (text && text.trim().length > 20) {
      if (e && e.preventDefault) e.preventDefault();
      pasteInput.value = text.slice(0, 100) + '... (' + (text.length / 1024).toFixed(1) + ' KB)';
      processPayload(text);
    } else if (text === '') {
      setStatus('Clipboard is empty or inaccessible.', 'error');
    }
  }

  // Auto-process as soon as the user pastes into the textarea
  pasteInput.addEventListener('paste', handlePasteEvent);

  // Global window paste fallback
  window.addEventListener('paste', (e) => {
    if (isImporting) return;
    if (document.activeElement !== pasteInput) {
      handlePasteEvent(e);
    }
  });

  // Dedicated "Paste Clipboard" button
  btnPasteClipboard.addEventListener('click', async () => {
    if (isImporting) return;
    try {
      setStatus('Reading clipboard...', 'info');
      const text = await navigator.clipboard.readText();
      if (text && text.trim().length > 20) {
        pasteInput.value = text.slice(0, 100) + '... (' + (text.length / 1024).toFixed(1) + ' KB)';
        processPayload(text);
      } else {
        setStatus('Clipboard is empty. Please capture the webpage first.', 'error');
      }
    } catch (err) {
      setStatus('Clipboard permission denied. Press Ctrl+V in the box instead.', 'error');
      pasteInput.focus();
    }
  });

  // Dedicated "Upload JSON" button
  btnUploadFile.addEventListener('click', () => {
    if (!isImporting) jsonFileInput.click();
  });

  jsonFileInput.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setStatus(`Reading ${file.name} (${(file.size / 1024).toFixed(1)} KB)...`, 'info');
    const reader = new FileReader();
    reader.onload = (evt) => {
      const text = evt.target?.result;
      if (text) {
        pasteInput.value = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
        processPayload(text);
      }
    };
    reader.onerror = () => {
      setStatus('Failed to read file: ' + reader.error?.message, 'error');
    };
    reader.readAsText(file);
    jsonFileInput.value = '';
  });

  // Drag & drop support on textarea
  pasteInput.addEventListener('dragover', (e) => {
    e.preventDefault();
    pasteInput.classList.add('dragover');
  });
  pasteInput.addEventListener('dragleave', () => {
    pasteInput.classList.remove('dragover');
  });
  pasteInput.addEventListener('drop', (e) => {
    e.preventDefault();
    pasteInput.classList.remove('dragover');
    if (isImporting) return;
    const file = e.dataTransfer?.files?.[0];
    if (file) {
      setStatus(`Loading dropped ${file.name}...`, 'info');
      const reader = new FileReader();
      reader.onload = (evt) => {
        const text = evt.target?.result;
        if (text) {
          pasteInput.value = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
          processPayload(text);
        }
      };
      reader.readAsText(file);
    }
  });

  // Import button triggers processing whatever is in the box
  btnImport.addEventListener('click', () => {
    if (!isImporting) processPayload(pasteInput.value);
  });

  window.onmessage = (event) => {
    const msg = event.data?.pluginMessage;
    if (!msg) return;
    if (msg.type === 'progress') {
      updateProgress(msg.percent, msg.label);
    } else if (msg.type === 'complete') {
      isImporting = false;
      updateProgress(100, 'Import completed!');
      setStatus('✅ Imported successfully!', 'success');
      btnImport.disabled = false;
      pasteInput.disabled = false;
      log(`Render completed in ${msg.duration || 0}ms`);
    } else if (msg.type === 'error') {
      isImporting = false;
      setStatus('❌ Render failed: ' + msg.message, 'error');
      btnImport.disabled = false;
      pasteInput.disabled = false;
      log('Error: ' + msg.message);
    } else if (msg.type === 'log') {
      log(msg.message);
    }
  };

  // Focus textarea on load
  setTimeout(() => pasteInput.focus(), 100);
</script>
</body>
</html>
